[theme]
# Every color below traces back to assets/logo.svg -- nothing invented here.
# Indigo (#2E2A5C) is the dominant ink in the wordmark/hourglass frame, so it
# is the one primary color for buttons, active tabs, and focus rings.
# secondaryBackgroundColor/borderColor are a 12%/35% white-blend of the
# logo's amber (#F2B94D) sand fill, giving widget surfaces and borders a
# warm tint instead of generic gray without introducing a new brand color.
primaryColor = "#2E2A5C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FDF7EA"
textColor = "#2E2A5C"
borderColor = "#FAE6C1"
# Distinctive display/body pairing (native Streamlit font theming, not a CSS
# hack): Fraunces is a warm, high-contrast serif for headings -- it echoes
# the "grow a tree" premise far more than a generic sans -- paired with
# Inter, a clean workhorse sans for body/widget text.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseFontWeight = 400
metricValueFontWeight = 800
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
